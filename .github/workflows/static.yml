# Simple workflow for checking, building, and deploying static content to GitHub Pages
name: Check, build, and deploy static content to Pages

on:
  # Runs checks and builds on pushes to any branch and on pull requests
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets read-only permissions of the GITHUB_TOKEN for checks and builds
permissions:
  contents: read

jobs:
  # Check formatting and lint before deployment; add other checks here as needed
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  # Build independently of checks, uploading a Pages artifact only from main
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm build
      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the built site
          path: "./dist"

  # Deploy only from the default branch after checks and build pass
  deploy:
    needs: [checks, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
